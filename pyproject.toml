[build-system]
requires = ["setuptools >= 77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openpile"
description = "Library for geotechnical pile calculations."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Guillaume Melin", email = "guillaume.melin@icloud.com" },
]
keywords = ["PILE", "Geotechnics", "monopile", "Geotechnical", "calculations", "PISA", "winkler"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas <= 2.3",
    "numpy >= 1.22",
    "matplotlib",
    "scipy",
    "pydantic >= 2.0",
    "typing_extensions",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    "Sphinx==5.3.0",
    "sphinx-rtd-theme==1.3.0",
    "sphinxcontrib-applehelp==1.0.2",
    "sphinxcontrib-devhelp==1.0.2",
    "sphinxcontrib-htmlhelp==2.0.0",
    "sphinxcontrib-jsmath==1.0.1",
    "sphinxcontrib-qthelp==1.0.3",
    "sphinxcontrib-serializinghtml==1.1.5",
    "sphinx-copybutton==0.5.2",
    "autodoc-pydantic==2.0.1",
    "pytest",
    "pytest-cov",
    "black==22.12.0",
    "tox==4.4.8",
]

[project.urls]
Documentation = "https://openpile.readthedocs.io/en/latest/"
Code = "https://github.com/TchilDill/openpile"
"Issue tracker" = "https://github.com/TchilDill/openpile/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "openpile.__version__" }

[tool.pytest.ini_options]
addopts = '--doctest-modules --doctest-glob="*.rst" --cov=openpile'
testpaths = [
    "test", "docs/source",
]

[tool.black]
line-length = 100
